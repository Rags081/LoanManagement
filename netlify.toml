[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  SECRETS_SCAN_OMIT_PATHS = ".env.example,docs/**,backups/**,scripts/**,tests/**,.github/**"
  # These env vars hold non-sensitive config (dev port, db driver name, default
  # localhost URLs, public app display name) rather than credentials. Their
  # values legitimately recur throughout the codebase (dev server fallbacks,
  # branding text, the "mongodb" driver name in dependency/script names, and
  # the VITE_-prefixed vars that are intentionally embedded in the client
  # bundle), so they are exempted from literal-value secrets scanning.
  SECRETS_SCAN_OMIT_KEYS = "DB_DRIVER,DB_HOST,NETLIFY_FUNCTIONS_PORT,VITE_API_URL,VITE_APP_NAME"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' /api/ /.netlify/functions/; frame-ancestors 'none';"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
